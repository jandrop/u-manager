name: Feature request
description: Suggest a new feature or improvement for U Manager
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the use case in
        your own words — what problem are you trying to solve?
  - type: checkboxes
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched the [open issues](https://github.com/jandrop/u-manager/issues) and didn't find a duplicate.
          required: true
        - label: This request is about U Manager only. I have not added links to competing products or any other promotional content. The issue tracker is not the place for that.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case from your point of view.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Optional — how you imagine this could work inside the app.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mock-ups, screenshots from the Unraid web UI, related links, etc.
